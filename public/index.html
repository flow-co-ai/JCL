<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Justice Consumer Law · Firm Report</title>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Mulish:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#12144a; --navy-deep:#0a0c30; --green:#33bb78; --green-ink:#1f8a57; --gold:#c8a45a; --gold-soft:#efe3c8;
  --brass:#c8a45a; --brass-soft:#e8f5ee;
  --ink:#141735; --muted:#5f6480; --line:#e4e6ee; --bg:#f5f6f9; --card:#ffffff;
  --good:#1f8a57; --bad:#b0463a;
  --s1:#12144a; --s2:#33bb78; --s3:#c8a45a; --s4:#6572b0; --s5:#9fd8bb; --s6:#9aa0b8; --s7:#dde0ea; --s8:#e3cf9f;
  --radius:4px; --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif; --font:'Mulish',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body{padding-bottom:env(safe-area-inset-bottom)}
.num{font-variant-numeric:tabular-nums lining-nums}
button{font:inherit;color:inherit;cursor:pointer}
.headline,.hstats .v,.kpi .v,#gate h1,.bar h2,.panel h3,#drawer h3,#drawer h4,.pace strong{font-variant-numeric:lining-nums proportional-nums}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}

/* gate */
#gate{min-height:100vh;display:grid;place-items:center;background:radial-gradient(1200px 600px at 80% 10%,#1b1f63 0%,var(--navy) 45%,var(--navy-deep) 100%);padding:24px}
#gate form{width:min(380px,100%);color:#fff;text-align:center}
#gate img{width:260px;max-width:80%;margin:0 auto 34px;display:block}
#gate h1{font-family:var(--serif);font-weight:600;font-size:34px;margin:0 0 6px;letter-spacing:.3px}
#gate p{color:#b7bcd6;margin:0 0 26px}
#gate input{width:100%;padding:13px 15px;border-radius:3px;border:1px solid #2f3478;background:rgba(255,255,255,.04);color:#fff;font:inherit;text-align:center;letter-spacing:.5px}
#gate input::placeholder{color:#8a90b5}
#gate button{margin-top:12px;width:100%;padding:13px;border:0;border-radius:3px;background:var(--green-ink);color:#fff;font-weight:700;letter-spacing:1.6px;font-size:13px}
#gate button:hover{background:#23995f}
#gate .err{color:#f0b3a8;min-height:22px;margin-top:12px;font-size:14px}

/* hero */
header{position:relative;overflow:hidden;background:radial-gradient(1100px 520px at 85% -10%,#1d2168 0%,var(--navy) 50%,var(--navy-deep) 100%);color:#fff;padding:calc(24px + env(safe-area-inset-top)) 0 0}
header .mark{position:absolute;right:-40px;top:-50px;width:430px;opacity:.045;pointer-events:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px;position:relative}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.top img{height:60px;width:auto;display:block}
.fresh{color:#9ea4c8;font-size:13px;text-align:right;line-height:1.35}
.fresh b{display:block;color:#fff;font-family:var(--serif);font-weight:600;font-size:18px;letter-spacing:.3px}
.headline{font-family:var(--serif);font-weight:500;font-size:clamp(32px,4.4vw,54px);line-height:1.08;margin:44px 0 0;max-width:880px;letter-spacing:.2px}
.headline b{font-weight:600;color:var(--green)}
.rule{height:1px;background:linear-gradient(90deg,var(--gold),rgba(200,164,90,0));margin:26px 0 22px;max-width:720px}
.hstats{display:flex;gap:44px;flex-wrap:wrap;margin:0 0 30px}
.hstats div{flex:0 1 auto;min-width:140px}
@media (max-width:560px){.hstats{display:grid;grid-template-columns:1fr 1fr;gap:20px 18px}.hstats div{min-width:0}.hstats div:first-child{grid-column:1/-1}}
.hstats .v{font-family:var(--serif);font-size:40px;font-weight:600;line-height:1}
.hstats .l{color:#aeb3d1;font-size:13.5px;margin-top:8px}
nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-top:1px solid rgba(255,255,255,.08)}
nav button{background:none;border:0;color:#aeb3d1;padding:15px 16px 16px;border-bottom:2px solid transparent;white-space:nowrap;font-weight:600;font-size:14px;letter-spacing:.3px}
nav button:hover{color:#fff}
nav button[aria-selected=true]{color:#fff;border-bottom-color:var(--green)}

/* controls */
.bar{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:34px 0 18px}
.bar h2{margin:0;font-family:var(--serif);font-size:34px;font-weight:600;line-height:1;color:var(--navy)}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:3px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:2px;font-size:13px;color:var(--muted);font-weight:600}
.seg button[aria-pressed=true]{background:var(--navy);color:#fff}

/* blocks */
.grid{display:grid;gap:14px}
.grid>*{min-width:0}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-top:2px solid var(--navy);border-radius:var(--radius);padding:15px 17px 14px}
.kpi .l{color:var(--muted);font-size:13px;font-weight:600}
.kpi .v{font-family:var(--serif);font-size:36px;font-weight:600;line-height:1.1;margin:4px 0 2px;color:var(--navy)}
.kpi .d{font-size:13px;color:var(--muted)}
.up{color:var(--good);font-weight:700} .down{color:var(--bad);font-weight:700}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 20px 16px;margin-top:14px}
.panel h3,#drawer h4{margin:0 0 3px;font-family:var(--serif);font-size:23px;font-weight:600;color:var(--navy);line-height:1.2}
#drawer h4{font-size:19px;margin:22px 0 8px}
.panel .hint,#drawer .hint{color:var(--muted);font-size:13px;margin:0 0 14px}
.pace{border-left:3px solid var(--green)}
.pace strong{font-family:var(--serif);font-size:21px;font-weight:600;color:var(--navy)}
.two{grid-template-columns:1.25fr 1fr}
@media (max-width:860px){.two{grid-template-columns:1fr}.hstats{gap:26px}.hstats .v{font-size:32px}.top img{height:44px}.fresh b{font-size:16px}}
.brief{margin:0;padding:0;list-style:none;counter-reset:b}
.brief li{padding:12px 0 12px 22px;border-top:1px solid var(--line);position:relative}
.brief li::before{content:'';position:absolute;left:2px;top:21px;width:8px;height:8px;border-radius:50%;background:var(--green)}
.brief li:first-child{border-top:0}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:1px;margin-right:6px;vertical-align:-1px}

/* tables */
.tw{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 8px;text-align:right;white-space:nowrap;border-top:1px solid var(--line)}
th{font-weight:700;color:var(--muted);font-size:12px;letter-spacing:.2px;border-top:0;border-bottom:1px solid var(--ink);cursor:pointer;user-select:none}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:180px}
tbody tr{cursor:pointer}
tbody tr:hover{background:#f7f8fb}
tfoot td{border-top:1px solid var(--ink);font-weight:700}
td .sm{display:block;color:var(--muted);font-size:12px}
.barcell{position:relative}
.barcell span.b{position:absolute;left:8px;bottom:3px;height:3px;background:var(--green);opacity:.55;border-radius:1px}
.more{margin-top:12px;background:none;border:1px solid var(--navy);color:var(--navy);border-radius:3px;padding:7px 14px;font-size:13px;font-weight:700}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:2px;border:1px solid var(--line);color:var(--muted);vertical-align:1px}
.est{color:var(--muted);font-style:italic}

/* drawer */
#drawer{position:fixed;inset:0;display:none;z-index:20}
#drawer.open{display:block}
#drawer .scrim{position:absolute;inset:0;background:rgba(10,12,48,.45)}
#drawer aside{position:absolute;right:0;top:0;bottom:0;width:min(540px,100%);background:#fff;overflow-y:auto;padding:calc(24px + env(safe-area-inset-top)) 24px calc(30px + env(safe-area-inset-bottom));border-top:3px solid var(--green)}
#drawer .x{position:absolute;right:14px;top:calc(14px + env(safe-area-inset-top));border:1px solid var(--line);background:#fff;border-radius:50%;width:34px;height:34px}
#drawer h3{margin:0 44px 4px 0;font-family:var(--serif);font-size:30px;font-weight:600;color:var(--navy);line-height:1.1}

footer{color:var(--muted);font-size:13px;margin:34px 0 44px;border-top:1px solid var(--line);padding-top:18px}
footer summary{cursor:pointer;font-weight:700;color:var(--navy)}
footer details{margin-top:10px}
footer dl{display:grid;grid-template-columns:max-content 1fr;gap:5px 16px;margin:12px 0}
footer dt{font-weight:700;color:var(--ink)}
svg text{font-family:var(--font)}
.empty{color:var(--muted);padding:16px 0}
@media (prefers-reduced-motion:no-preference){.headline,.hstats{animation:rise .6s ease-out both}.hstats{animation-delay:.08s}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}}
</style>
</head>

<script>
'use strict';
let D = null;
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------- decrypt ---------- */
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function decrypt(pw, blob) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(blob.salt), iterations: 200000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const gz = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(blob.iv) }, key, b64(blob.ct));
  const stream = new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(stream).text());
}
async function open(pw) {
  const r = await fetch('data.enc.json', { cache: 'no-store' });
  if (!r.ok) {
    const p = await fetch('data.json', { cache: 'no-store' });
    if (p.ok) return p.json();
    throw new Error('The report data is not published yet.');
  }
  return decrypt(pw, await r.json());
}
$('#gateForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = $('#pw').value; $('#gateErr').textContent = 'Opening…';
  try { D = await open(pw); sessionStorage.setItem('jcl_pw', pw); start(); }
  catch (err) { $('#gateErr').textContent = err.message.includes('published') ? err.message : 'That password did not work.'; }
});
(async () => { const pw = sessionStorage.getItem('jcl_pw'); if (pw != null) { try { D = await open(pw); start(); } catch { sessionStorage.removeItem('jcl_pw'); } } })();

/* ---------- formatting ---------- */
const $k = (v) => { v = v || 0; const a = Math.abs(v);
  if (a >= 1e6) return '$' + (v / 1e6).toFixed(a >= 1e7 ? 1 : 2) + 'M';
  if (a >= 1e4) return '$' + Math.round(v / 1e3) + 'K';
  if (a >= 1e3) return '$' + (v / 1e3).toFixed(1) + 'K';
  return '$' + Math.round(v); };
const $f = (v) => '$' + Math.round(v || 0).toLocaleString('en-US');
const int = (v) => Math.round(v || 0).toLocaleString('en-US');
const pct = (v) => (v == null || !isFinite(v) ? '–' : Math.round(v * 100) + '%');
const chg = (a, b) => { if (!b) return ''; const c = (a - b) / b; return `<span class="${c >= 0 ? 'up' : 'down'}">${c >= 0 ? '▲' : '▼'} ${Math.abs(Math.round(c * 100))}%</span>`; };
const sum = (arr, f) => arr.reduce((a, x) => a + (typeof f === 'function' ? f(x) : x[f] || 0), 0);
const group = (arr, keyFn) => arr.reduce((m, x) => { const k = keyFn(x); (m[k] ||= []).push(x); return m; }, {});
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const mLabel = (m, y) => MON[+m.slice(5) - 1] + (y ? ' ' + m.slice(2, 4) : '');

/* ---------- time ---------- */
const now = new Date();
const curM = now.toISOString().slice(0, 7);
function addM(m, k) { const [y, mo] = m.split('-').map(Number); const d = new Date(Date.UTC(y, mo - 1 + k, 1)); return d.toISOString().slice(0, 7); }
function monthsBack(k, end = curM) { const out = []; for (let i = k - 1; i >= 0; i--) out.push(addM(end, -i)); return out; }
function weekdays(y, mo, uptoDay) { let n = 0; const last = new Date(Date.UTC(y, mo, 0)).getUTCDate(); for (let d = 1; d <= Math.min(uptoDay ?? last, last); d++) { const w = new Date(Date.UTC(y, mo - 1, d)).getUTCDay(); if (w && w < 6) n++; } return n; }
const inYr = (ms) => (ms.every((m) => m.startsWith(String(now.getUTCFullYear()))) ? ms : null);
const RANGES = {
  month: { label: 'This month', months: () => [curM], prior: () => inYr([addM(curM, -1)]) },
  last: { label: 'Last month', months: () => [addM(curM, -1)], prior: () => inYr([addM(curM, -2)]) },
  q: { label: '3 months', months: () => monthsBack(3, addM(curM, -1)), prior: () => inYr(monthsBack(3, addM(curM, -4))) },
  ytd: { label: `${now.getUTCFullYear()} to date`, months: () => { const o = []; for (let m = `${now.getUTCFullYear()}-01`; m <= curM; m = addM(m, 1)) o.push(m); return o; }, prior: () => null },
};
let range = 'ytd';
const inR = (m, set) => (set ? set.includes(m) : !!m);
const rangeNote = () => { const ms = RANGES[range].months(); if (range === 'ytd') return `${now.getUTCFullYear()} to date`; return ms.length === 1 ? mLabel(ms[0], true) + (ms[0] === curM ? ' so far' : '') : `${mLabel(ms[0], true)} – ${mLabel(ms.at(-1), true)}`; };

/* ---------- charts ---------- */
function bars({ months, stacks, height = 220, fmt = $k, ghost = null, highlight = null, half = false }) {
  const vw = Math.min(1136, window.innerWidth - 80), W = Math.max(300, half && window.innerWidth > 860 ? vw / 2 - 20 : vw), H = height, pad = { l: 8, r: 8, t: 18, b: 28 };
  const totals = months.map((_, i) => sum(stacks, (s) => s.values[i] || 0));
  const max = Math.max(1, ...totals, ...(ghost || []).map((g) => g || 0));
  const bw = (W - pad.l - pad.r) / months.length, gap = Math.max(2, bw * 0.22);
  const y = (v) => pad.t + (H - pad.t - pad.b) * (1 - v / max);
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" preserveAspectRatio="none" style="height:${H}px;display:block">`;
  months.forEach((m, i) => {
    let base = 0; const x = pad.l + i * bw + gap / 2, w = bw - gap;
    const dim = highlight && !highlight.includes(m);
    stacks.forEach((s) => { const v = s.values[i] || 0; if (!v) return; const y1 = y(base + v), y0 = y(base);
      svg += `<rect x="${x}" y="${y1}" width="${w}" height="${Math.max(0, y0 - y1)}" fill="${s.color}" opacity="${dim ? 0.35 : 1}"><title>${esc(s.label)} ${mLabel(m, true)}: ${fmt(v)}</title></rect>`; base += v; });
    if (ghost && ghost[i]) svg += `<line x1="${x}" x2="${x + w}" y1="${y(ghost[i])}" y2="${y(ghost[i])}" stroke="var(--gold)" stroke-width="2.5" stroke-dasharray="5 3"><title>Same month a year earlier: ${fmt(ghost[i])}</title></line>`;
    const every = Math.max(1, Math.ceil(44 / bw));
    if (i % every === 0 || i === months.length - 1) svg += `<text x="${x + w / 2}" y="${H - 8}" text-anchor="middle" font-size="12" fill="var(--muted)">${mLabel(m, m.endsWith('-01') || i === 0)}</text>`;
  });
  return svg + '</svg>';
}
const legend = (items) => `<div class="legend">${items.map(([c, l]) => `<span><i style="background:${c}"></i>${esc(l)}</span>`).join('')}</div>`;
const COLORS = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s6)', 'var(--s5)', 'var(--s4)', 'var(--s8)', 'var(--s7)'];

/* ---------- core: 2026 packaged cases ---------- */
const YEAR = () => D.year || now.getUTCFullYear();
const yearMonths = () => { const out = []; for (let m = `${YEAR()}-01`; m <= curM && m.startsWith(String(YEAR())); m = addM(m, 1)) out.push(m); return out; };
const inYear = (m) => !!m && m.startsWith(String(YEAR())) && m <= curM;
const fees = (rows) => sum(rows, 'fees');
const C = (set, f = () => true) => D.cohort.filter((r) => inR(r.m, set) && f(r));
const ACTIVE = ['Signing', 'Demand', 'Litigation'];
const WON = ['Collected', 'Won, not collected'];
const GROUP_ORDER = ['Collected', 'Won, not collected', 'Litigation', 'Demand', 'Signing', 'On hold', 'Dismissed', 'Charged back', 'Not found in Zoho'];
const GROUP_COLOR = { 'Collected': 'var(--green-ink)', 'Won, not collected': 'var(--green)', 'Litigation': 'var(--navy)', 'Demand': 'var(--s4)', 'Signing': 'var(--s6)', 'On hold': 'var(--s7)', 'Dismissed': 'var(--s8)', 'Charged back': 'var(--bad)', 'Not found in Zoho': '#cfd3de', 'Other': '#cfd3de' };

// History (all Zoho cases) for expected value.
function histFor(def) {
  const all = Object.values(D.hist || {}), gp = sum(all, 'paid'), gl = sum(all, 'lost'), gf = sum(all, 'fees');
  const h = D.hist?.[def];
  const win = h && h.paid + h.lost >= 3 ? h.paid / (h.paid + h.lost) : gp + gl ? gp / (gp + gl) : 0;
  const avg = h && h.paid ? h.fees / h.paid : gp ? gf / gp : 0;
  return { win, avg, paid: h?.paid || 0 };
}
function metrics(rows) {
  const by = (g) => rows.filter((r) => (Array.isArray(g) ? g.includes(r.group) : r.group === g));
  const n = sum(rows, 'n'), cb = sum(by('Charged back'), 'n');
  const col = by('Collected'), wait = by('Won, not collected'), act = rows.filter((r) => ACTIVE.includes(r.group) && r.stage !== 'Failed Demand');
  const est = sum(act, (r) => { const h = histFor(r.def); return r.n * h.win * h.avg; });
  return { n, cb, cbRate: n ? cb / n : null, filed: sum(rows.filter((r) => r.filed), 'n'), presuit: sum(rows.filter((r) => r.presuit), 'n'), drafted: sum(rows.filter((r) => r.drafted), 'n'),
    won: sum(by(WON), 'n'), colN: sum(col, 'n'), col: fees(col), waitN: sum(wait, 'n'), wait: fees(wait), actN: sum(act, 'n'), est,

}
function statsBy(set, key) {

  return Object.entries(g).map(([k, rows]) => ({ key: k, ...metrics(rows) }));
}
function costFor(src, set) {

  const c = D.source_costs?.[src]; if (!c) return null;
  return sum(Object.entries(c).filter(([m]) => inR(m, set)), ([, v]) => v) || null;
}

  const h = field === 'def' ? histFor(key) : null;
  openDrawer(`<h3>${esc(key)}</h3><p class="hint">${esc(title)} · cases packaged ${esc(rangeNote())}</p>
    <div class="grid kpis" style="margin:14px 0"><div class="kpi"><div class="l">Packaged</div><div class="v num">${int(m.n)}</div></div><div class="kpi"><div class="l">Charged back</div><div class="v num">${pct(m.cbRate)}</div></div><div class="kpi"><div class="l">Est. value</div><div class="v num">${$k(m.value)}</div></div></div>
    <h4>By month and stage</h4>${statusChart(D.cohort.filter((r) => inYear(r.m) && r[field] === key), months)}
    <h4>Where the money stands</h4><table><tbody>
      <tr><td>Fees collected</td><td class="num">${$f(m.col)}</td></tr><tr><td>Fees won, waiting on payment</td><td class="num">${$f(m.wait)}</td></tr>
      <tr><td>Open cases being worked</td><td class="num">${int(m.actN)}</td></tr><tr><td>Estimated value of open cases <span class="sm">history's win rate × average fee</span></td><td class="num">${$f(m.est)}</td></tr></tbody></table>
    ${h ? `<h4>History with ${esc(key)}</h4><table><tbody><tr><td>Past cases paid</td><td class="num">${int(h.paid)}</td></tr><tr><td>Win rate</td><td class="num">${pct(h.win)}</td></tr><tr><td>Average fee</td><td class="num">${$k(h.avg)}</td></tr></tbody></table>` : ''}
    <h4>By ${other === 'src' ? 'source' : 'defendant'}</h4><table><tbody>${split.map(([k, n, v]) => `<tr><td>${esc(k)}</td><td class="num">${n}</td><td class="num est">${$k(v)}</td></tr>`).join('') || '<tr><td>None</td></tr>'}</tbody></table>
    <p class="hint" style="margin-top:14px">Case list: JCL Tracker › monthly tabs, and Zoho › Cases.</p>`);
}

/* ---------- hero ---------- */
const PHRASE = { month: ['this month so far', 'last month'], last: ['last month', 'the month before'], q: ['over the last 3 months', 'the 3 months before'], ytd: [`so far in ${new Date().getUTCFullYear()}`, null] };
const cases = (k) => `${int(k)} case${Math.round(k) === 1 ? '' : 's'}`;
function paceOf(v) { const [y, mo] = curM.split('-').map(Number), done = weekdays(y, mo, now.getUTCDate()), all = weekdays(y, mo); return done ? v / done * all : v; }
function vs(a, b, prior, fmt = int) {
  if (!prior || !b) return '';
  if (range === 'month') return `, on pace for ${fmt(paceOf(a))} against ${fmt(b)} last month`;
  const c = Math.round(((a - b) / b) * 100);
  return Math.abs(c) < 1 ? `, flat on ${prior}` : `, ${c >= 0 ? 'up' : 'down'} ${Math.abs(c)}% on ${prior}`;
}
function hero() {
  const r = RANGES[range], set = r.months(), pset = r.prior(), [when, prior] = PHRASE[range];
  const G = (v) => `<b>${v}</b>`;
  const m = metrics(C(set)), pm = pset ? metrics(C(pset)) : null;
  let h = '', st = [];
  if (view === 'overview') {
    h = `${G(int(m.n))} cases packaged ${when}${vs(m.n, pm?.n, prior)}, worth an estimated ${$k(m.value)}.`;
    st = [[$k(m.col), `fees collected, ${cases(m.colN)}`], [$k(m.wait), `won, waiting on payment (${cases(m.waitN)})`], [pct(m.cbRate), `charged back (${cases(m.cb)})`]];
  } else if (view === 'defendants') {
    const t = statsBy(set, 'def').sort((a, b) => b.value - a.value)[0];
    h = t ? `${G(esc(t.key))} is the biggest defendant ${when}: ${cases(t.n)} worth an estimated ${$k(t.value)}.` : `No cases packaged ${when} yet.`;
    st = [[int(statsBy(set, 'def').length), `defendants in cases packaged ${when}`], [t ? $k(histFor(t.key).avg) : '–', t ? `average fee on ${esc(t.key)}, all history` : ''], [pct(t ? histFor(t.key).win : null), t ? `win rate on ${esc(t.key)}, all history` : '']];
  } else if (view === 'sources') {
    const ss = statsBy(set, 'src').sort((a, b) => b.n - a.n), t = ss[0], low = [...ss].filter((x) => x.n >= 5 && x !== t).sort((a, b) => a.cbRate - b.cbRate)[0];
    h = t ? `${G(esc(t.key))} supplied ${int(t.n)} of ${int(m.n)} cases packaged ${when}.` : `No cases packaged ${when} yet.`;
    st = [[t ? pct(t.cbRate) : '–', t ? `chargeback rate on ${esc(t.key)} cases` : ''], [low ? pct(low.cbRate) : '–', low ? `lowest chargeback rate: ${esc(low.key)}` : ''], [t ? $k(t.value) : '–', t ? `estimated value of ${esc(t.key)} cases` : '']];
  } else if (view === 'team') {
    const ts = statsBy(set, 'member').sort((a, b) => b.n - a.n);
    h = `${G(int(m.n))} cases packaged ${when}${ts.length ? `, ${ts.map((t) => `${int(t.n)} by ${esc(t.key)}`).join(', ')}` : ''}.`;
    st = [[pct(m.n ? m.presuit / m.n : null), 'sent as pre-suit demands'], [pct(m.n ? m.filed / m.n : null), 'filed in court'], [pct(m.cbRate), 'charged back']];
  } else if (view === 'marketing') {
    const spend = sum(D.meta_month.filter((x) => inR(x.m, set)), 'spend'), mc = metrics(C(set, (x) => x.src === 'Meta'));
    h = spend ? `${G($k(spend))} on Meta ${when} packaged ${int(mc.n)} case${mc.n === 1 ? '' : 's'}${mc.n ? `, ${$k(spend / mc.n)} per packaged case` : ''}.` : `No Meta spend recorded ${when}.`;
    const sdr = scDefStats(set, pset), sd = sum(sdr, 'impressions'), sdp = sdr.some((x) => x.prior != null) ? sum(sdr, (x) => x.prior || 0) : 0;
    st = [[$k(mc.value), 'estimated value of Meta cases'], [pct(mc.cbRate), 'of Meta cases charged back'], [int(sd), `times Google showed the site for searches naming a defendant${sdp ? ` (${sd >= sdp ? '+' : ''}${Math.round(((sd - sdp) / sdp) * 100)}%)` : ''}`]];
  } else if (view === 'intake') {
    const ld = D.leads.filter((x) => inR(x.m, set)), pl = pset ? D.leads.filter((x) => inR(x.m, pset)) : [];
    const n = sum(ld, 'n'), c = sum(ld, 'cases');
    h = `${G(int(n))} leads came in ${when}${vs(n, sum(pl, 'n'), prior)}, and ${int(c)} became cases.`;
    st = [[pct(n ? c / n : null), 'of those leads became cases'], [int(m.actN), 'packaged cases still being worked'], [$k(m.wait), `won, waiting on payment (${cases(m.waitN)})`]];
  }
  $('#headline').innerHTML = h;
  $('#hstats').innerHTML = st.filter((x) => x[1]).map(([v, l]) => `<div><div class="v num">${v}</div><div class="l">${l}</div></div>`).join('');
}

/* ---------- shell ---------- */
function render() {
  hero();
  $('#tabs').innerHTML = Object.entries(VIEWS).map(([k, l]) => `<button role="tab" data-view="${k}" aria-selected="${k === view}">${l}</button>`).join('');
  $('#view').innerHTML = { overview: renderOverview, defendants: renderDefendants, sources: renderSources, team: renderTeam, marketing: renderMarketing, intake: renderIntake }[view]();
}
function start() {
  $('#gate').hidden = true; $('#gate').style.display = 'none'; $('#app').hidden = false;
  $('#fresh').textContent = 'Updated ' + new Date(D.generated_at).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  $('#hlogo').src = $('#gate img').src;
  const q = D.quality, s = q.sheet || {};
  $('#foot').innerHTML = `Cases come from the JCL Tracker (the ${YEAR()} monthly packaged-case tabs). Stages and dollars come from each case in Zoho CRM. Marketing from Meta, Google Search Console and Google Analytics. Refreshed automatically every 2 hours.
    <details><summary>What each number means</summary><dl>
      <dt>Packaged</dt><dd>A case listed on a ${YEAR()} monthly tab of the tracker, counted in that tab's month.</dd>
      <dt>Charged back</dt><dd>A tracker row highlighted red.</dd>
      <dt>Pre-suit demand</dt><dd>The monthly tab's filing column says a pre-suit demand was sent.</dd>
      <dt>Filed in court</dt><dd>The monthly tab's filing column says Filed. Pre-suit demands are never counted as filed.</dd>
      <dt>Fees</dt><dd>${esc(D.fee_label)}${D.fee_share !== 1 ? ` × ${D.fee_share}` : ''}, from the Attorney's Fees field on the matching Zoho case.</dd>
      <dt>Collected</dt><dd>The Zoho case is in Settled Paid.</dd>
      <dt>Won, waiting on payment</dt><dd>The Zoho case is in Settled Unpaid or Settlement Agreement.</dd>
      <dt>Estimated value</dt><dd>Fees collected + fees won and waiting + each open case × its defendant's historical win rate × historical average fee, from all past Zoho cases. An estimate, not a promise.</dd>
      <dt>Source</dt><dd>As recorded in the tracker's Source column.</dd>
      <dt>Team member</dt><dd>The letter next to each case in the tracker.</dd>
    </dl></details>
    <details><summary>Data checks</summary><p>${int(s.rows)} packaged cases read from ${int((s.tabs || []).length)} tracker tabs. ${int(s.matched)} matched to a Zoho case by name${s.rows - s.matched ? `; ${int(s.rows - s.matched)} did not match and show as "Not found in Zoho" with no dollars` : ''}. ${int(s.red)} charged back.${q.windsor_errors?.length ? ' Some marketing data did not load on the last refresh: ' + esc(q.windsor_errors.join('; ')) : ''}</p></details>`;
  render();
}
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-view],[data-range],[data-sort],[data-def],[data-src],#defAll'); if (!t) return;
  if (t.dataset.view) { view = t.dataset.view; defShowAll = false; defSort = 'value'; render(); window.scrollTo({ top: 0 }); }
  else if (t.dataset.range) { range = t.dataset.range; render(); }
  else if (t.dataset.sort) { defSort = t.dataset.sort; render(); }
  else if (t.id === 'defAll') { defShowAll = !defShowAll; render(); }
  else if (t.dataset.def) drawer(t.dataset.def, 'def', 'Defendant');
  else if (t.dataset.src) drawer(t.dataset.src, 'src', 'Source');
});
</script>
</body>
