name: Zoho check
on:
  workflow_dispatch:
    inputs:
      script:
        description: Which check to run
        type: choice
        options: [sheet, money, fields]
        default: sheet
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check Zoho (read-only)
        run: |
          case "${{ inputs.script }}" in
            sheet) node scripts/sheet-check.mjs ;;
            money) node scripts/zoho-money.mjs ;;
            *) node scripts/zoho-check.mjs ;;
          esac
        env:
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
